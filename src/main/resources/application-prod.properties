# Perfil de PRODUCCIÓN: se activa en Render con SPRING_PROFILES_ACTIVE=prod.
# Ningún valor secreto está escrito aquí: los tres ${...} llegan desde Render.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Crea o actualiza las tablas al arrancar (en proyectos grandes se usaría Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Neon es pequeño en el plan gratuito: con 5 conexiones sobra.
spring.datasource.hikari.maximum-pool-size=5

# Render recibe la visita en HTTPS y se la pasa a la app por dentro:
# esta línea hace que Spring respete el "https" original al redirigir.
server.forward-headers-strategy=framework
