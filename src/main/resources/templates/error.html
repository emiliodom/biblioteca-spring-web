<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ocurrió un problema</title>
  <link rel="stylesheet" th:href="@{/estilos.css}">
</head>

<body>
  <main>
    <h1>Biblioteca</h1>
    <div class="aviso error" role="alert">
      <p><strong>No pudimos mostrar esta página.</strong></p>
      <p>Revisa la dirección o vuelve a la lista de libros.</p>
      <p>Código del problema: <span th:text="${status}">404</span></p>
    </div>
    <p><a th:href="@{/libros}">Ver libros</a></p>
  </main>
</body>

</html>
